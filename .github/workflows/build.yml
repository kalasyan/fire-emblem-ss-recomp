name: build

on:
  push:
    branches: [main]
    # Pushing a v* tag (or running the workflow by hand with a release tag)
    # creates the release, a pre-release if the tag has a suffix such as
    # v1.0-beta, and attaches the files.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to create from this commit and attach the files to (e.g. v1.0); empty to only build
        required: false
        default: ''
  # Publishing a release from the GitHub page also attaches the files to it.
  release:
    types: [published]

jobs:
  linux:
    name: Linux (headless smoke test, ${{ matrix.region }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        region: [us, eu]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build lld
      - name: Configure
        # clang, like the Android NDK: it rejects implicit declarations, GCC does not.
        run: cmake -B build -G Ninja -DFE8_HOST=headless -DFE8_REGION=${{ matrix.region }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build
      - name: Smoke test (no game data)
        # The game can't run without the player's ROM, so CI only checks that
        # the engine starts and refuses a file that isn't Fire Emblem.
        run: |
          head -c 16777216 /dev/zero > zero.gba
          if ./build/fe8_headless --rom zero.gba --frames 10 --dump-every 0 > out.txt 2>&1; then
            cat out.txt; echo "a zero-filled ROM was accepted"; exit 1
          fi
          cat out.txt
          grep -q "ROM rejected" out.txt
      - name: Frame pacing test
        run: ./build/fe8_pacing_test

  appimage:
    name: Linux / Steam Deck AppImage (${{ matrix.region }})
    # The oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        region: [eu, us]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        # SDL3's headers for X11, Wayland, audio and gamepads (it loads the
        # libraries themselves at run time, from the player's system).
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lld clang \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libdrm-dev \
            libgbm-dev libdbus-1-dev libibus-1.0-dev libudev-dev libasound2-dev \
            libpulse-dev libpipewire-0.3-dev libusb-1.0-0-dev
      - name: Configure
        run: >
          cmake -B build -G Ninja -DFE8_HOST=sdl -DFE8_REGION=${{ matrix.region }}
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DSDL_STATIC=ON -DSDL_SHARED=OFF
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL=$PWD/appimagetool \
            packaging/linux/build-appimage.sh build "Fire_Emblem_Sacred_Stones-${{ matrix.region }}-x86_64.AppImage"
      - uses: actions/upload-artifact@v6
        with:
          name: fe8-linux-appimage-${{ matrix.region }}
          path: Fire_Emblem_Sacred_Stones-*.AppImage
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Set up the release keystore
        # Optional: without these secrets the APKs are signed with the
        # runner's throwaway debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = release ] || [ "${{ github.ref_type }}" = tag ] || [ -n "${{ inputs.release }}" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release APKs are signed with a debug key"
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log
      - name: Show the signing certificate
        # Release APKs must keep the same certificate so updates install
        # over older versions.
        run: |
          # APK signature scheme v2 only (minSdk 24): keytool can't read it.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for apk in android/app/build/outputs/apk/*/release/*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep -E "DN:|SHA-256"
          done
      - name: Report build errors
        if: failure()
        working-directory: android
        # Surface the end of the log as an annotation (readable from the API).
        run: |
          {
            grep -nE "error|Error|FAILED|What went wrong" gradle.log | tail -40
            echo "----- tail -----"
            tail -60 gradle.log
          } > summary.txt || true
          msg=$(sed -e 's/%/%25/g' summary.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build log::${msg}"
      - uses: actions/upload-artifact@v6
        with:
          name: fe8-android-apk
          path: android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

  release:
    name: Attach to the release
    # Only the files built above: APKs and AppImages, never game data.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [linux, appimage, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # A release made on the page with a new tag can also fire the tag push.
    concurrency: release-${{ inputs.release || github.ref_name }}
    steps:
      # Only for the release notes in docs/release-notes/<tag>.md, if there are any.
      - uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release || github.ref_name }}
        run: |
          notes="src/docs/release-notes/$TAG.md"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes $pre
          fi
          if [ -f "$notes" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi
          mkdir dist
          # app-eu-release.apk -> Fire_Emblem_Sacred_Stones-eu.apk
          # With a single artifact, download-artifact extracts it straight into
          # artifacts/ (no folder named after it), so search the whole tree.
          for apk in $(find artifacts -path '*/release/*.apk'); do
            region=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "dist/Fire_Emblem_Sacred_Stones-$region.apk"
          done
          cp artifacts/*-linux-appimage-*/*.AppImage dist/
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
